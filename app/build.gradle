plugins { id 'com.android.application' }
android {
    namespace 'com.homesweetlove.hwpapp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.homesweetlove.hwpapp'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE'] } }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
    sourceSets { androidTest { java.srcDirs += ['src/test/java'] } }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
